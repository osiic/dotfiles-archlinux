format = """
$username\
$hostname\
$directory\
$git_branch\
$git_status\
$nodejs\
$rust\
$golang\
$python\
$fill\
$cmd_duration\
$time\
$line_break\
$character"""

right_format = """"""

palette = "catppuccin_mocha"

[fill]
symbol = " "

[username]
show_always = true
style_user = "bold lavender"
style_root = "bold red"
format = "[$user]($style)"

[hostname]
ssh_only = false
style = "bold mauve"
format = "[@$hostname]($style) "

[directory]
style = "bold blue"
truncation_length = 4
truncate_to_repo = true
format = "in [$path]($style) "

[time]
disabled = false
time_format = "%a %d %b %T"
style = "bold subtext0"
format = "[󰃭 $time]($style)"

[cmd_duration]
min_time = 0
show_milliseconds = false
style = "bold yellow"
format = "[󰔚 $duration]($style) "

[character]
success_symbol = "[❯](bold mauve)"
error_symbol = "[❯](bold red)"

[git_branch]
symbol = " "
style = "bold mauve"

[git_status]
style = "bold red"
format = '([\[$all_status$ahead_behind\]]($style) )'

[nodejs]
symbol = " "
style = "bold green"

[rust]
symbol = " "
style = "bold peach"

[golang]
symbol = " "
style = "bold sapphire"

[python]
symbol = " "
style = "bold yellow"

[palettes.catppuccin_mocha]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b4fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"
